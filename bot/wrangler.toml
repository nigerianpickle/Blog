name = "blog-bot"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Created with: npx wrangler kv namespace create BLOG_BOT
# Paste the id it prints below.
[[kv_namespaces]]
binding = "BLOG_BOT"
id = "b1d209d8fc1046a190d23bb1097ac94c"

[vars]
GITHUB_REPO = "nigerianpickle/Blog"
GITHUB_BRANCH = "main"
SITE_URL = "https://nigerianpickle.github.io/Blog"
SITE_TZ = "America/Winnipeg"

# Your numeric Telegram ID. Message the bot once before setting this and
# it will tell you what yours is. Comma-separated if you want more than one.
ALLOWED_USER_IDS = "1966002723"

# Secrets are NOT set here. Run these three, one at a time:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   npx wrangler secret put GITHUB_TOKEN
