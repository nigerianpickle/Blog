# ─────────────────────────────────────────────────────────
#  Edit this file by hand. Everything here shows up on the
#  site. The bot never touches it.
# ─────────────────────────────────────────────────────────

title: Nwogo's Blog
tagline: My thoughts, sent from an Iphone.
description: A personal blog.
author: Daniel Nwogo

# If your repo is called <username>.github.io:
#   url: "https://<username>.github.io"   baseurl: ""
# If it's called anything else (e.g. "blog"):
#   url: "https://<username>.github.io"   baseurl: "/blog"
url: "https://nigerianpickle.github.io"
baseurl: "/Blog"

timezone: America/Winnipeg

# ── Shown in the "Elsewhere" block at the bottom of every page ──
links:
  - name: GitHub
    url: https://nigerianpickle.github.io
  - name: X
    url: https://x.com
  - name: LinkedIn
    url: https://linkedin.com/in/danielnwogo

  - name: RSS
    url: /feed.xml

# ── Shown in the "Get in touch" block ──
contact:
  email: nwogodaniel123@gmail.com
  note: Open to interesting conversations. I read everything.

# ── Machinery below; you can leave it alone ──
permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-feed

feed:
  path: feed.xml

exclude:
  - bot/
  - README.md
  - SETUP.md
  - node_modules/
  - package.json
  - package-lock.json
